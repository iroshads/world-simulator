<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>World Simulator — Real-Time Multi-Agent Simulation Sandbox</title>

    <meta name="keywords" content="simulation, multi-agent simulation, city builder, traffic simulation, agent-based modeling, robotics simulation, social network simulation, three.js, digital twin, sandbox" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="canonical" href="https://world-simulator-indol.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="World Simulator" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="World Simulator — Real-Time Multi-Agent Simulation Sandbox" />
    <meta name="twitter:description" content="Build a living city, tune a traffic network, command a robot fleet, and watch echo chambers emerge — four live agent-based simulations in your browser." />
    <meta name="twitter:image" content="https://world-simulator-indol.vercel.app/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "World Simulator",
      "url": "https://world-simulator-indol.vercel.app/",
      "description": "A real-time, browser-based sandbox for multi-agent simulation across four domains: city growth, traffic networks, autonomous robot fleets, and social opinion dynamics.",
      "applicationCategory": "SimulationApplication",
      "operatingSystem": "Any (web browser)",
      "browserRequirements": "Requires WebGL",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "Irosha de Silva", "url": "https://www.irosha.com" }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #f4f6fb;
        color: #1e293b;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        background-image:
          radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.07) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.07) 0px, transparent 50%);
        background-attachment: fixed;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .anim-in { animation: fadeSlideIn 0.35s ease both; }

      @keyframes tickerIn {
        from { opacity: 0; transform: translateY(100%); }
        to { opacity: 1; transform: translateY(0); }
      }
      .ticker-in { animation: tickerIn 0.3s ease both; }

      /*
        Range inputs are rendered invisible and layered over custom track/thumb
        visuals. The native thumb still needs explicit dimensions — a thumb with
        `appearance: none` and no size collapses to zero width and cannot be
        grabbed, which silently breaks dragging.
      */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        pointer-events: auto;
        touch-action: none;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 100%;
        background: transparent;
        border: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: transparent;
        border: none;
        cursor: grab;
      }
      input[type="range"]:active::-webkit-slider-thumb { cursor: grabbing; }
      input[type="range"]::-moz-range-track {
        height: 100%;
        background: transparent;
        border: none;
      }
      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: transparent;
        border: none;
        cursor: grab;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>World Simulator is an interactive WebGL simulation and requires JavaScript to run.</noscript>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
