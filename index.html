<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Simulator — Live Multi-Agent Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #f4f6fb;
        color: #1e293b;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        background-image:
          radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.07) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.07) 0px, transparent 50%);
        background-attachment: fixed;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .anim-in { animation: fadeSlideIn 0.35s ease both; }

      @keyframes tickerIn {
        from { opacity: 0; transform: translateY(100%); }
        to { opacity: 1; transform: translateY(0); }
      }
      .ticker-in { animation: tickerIn 0.3s ease both; }

      input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
